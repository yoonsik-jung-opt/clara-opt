[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clara-opt"
version = "0.2.1"
description = "Solver-intrinsic explanations and reoptimization for linear programming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yoonsik Yang" },
]
keywords = [
    "linear-programming",
    "optimization",
    "sensitivity-analysis",
    "explainable-optimization",
    "counterfactual-explanations",
    "reoptimization",
    "simplex-method",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "highspy>=1.7",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "scipy>=1.10",
]

[project.scripts]
clara = "clara.cli:main"

[project.urls]
Homepage = "https://github.com/yoonsikyang/clara-opt"
Repository = "https://github.com/yoonsikyang/clara-opt"
Issues = "https://github.com/yoonsikyang/clara-opt/issues"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["clara"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length — ruff format handles this
    "B008",   # function call in default argument — click uses this pattern
]

[tool.ruff.lint.isort]
known-first-party = ["clara"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "phase2: marks tests for Phase 2 features (reoptimization)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["clara"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]